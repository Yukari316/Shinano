<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shinano</title>
    <script type="importmap">
      { "imports": { "vue": "/vendor/vue.js", "@shinano/plugin-sdk": "/sdk/plugin-sdk.js" } }
    </script>
    <script>
      // 在样式加载前确定主题，避免闪烁；读取失败时跟随系统。
      try {
        const saved = localStorage.getItem('shinano-theme')
        if (saved === 'emerald' || saved === 'dim') document.documentElement.dataset.theme = saved
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
